<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.37/Tone.min.js"></script>
<script>
  const game = document.getElementById("game");
  const carre = document.getElementById("carre");
  const scoreEl = document.getElementById("score");
  const citationEl = document.getElementById("citation");
  const clickSound = document.getElementById("clickSound");

  let score = 0;

  const citations = [
    "« Continue, tu brilles déjà. »",
    "« Chaque clic te rend meilleur. »",
    "« Tu progresses à ton rythme. »",
    "« Tu es plus fort que tu ne le crois. »",
    "« Rien n’arrête quelqu’un qui continue. »",
    "« Aujourd’hui, tu gagnes encore. »",
    "« Tu écris ton propre rythme. »"
  ];

  let vx = 1.5;
  let vy = 1.5;

  let x = 100;
  let y = 100;

  function moveSquare() {
    const maxX = game.clientWidth - carre.clientWidth;
    const maxY = game.clientHeight - carre.clientHeight;

    x += vx;
    y += vy;

    if (x <= 0 || x >= maxX) vx *= -1;
    if (y <= 0 || y >= maxY) vy *= -1;

    carre.style.left = x + "px";
    carre.style.top = y + "px";

    requestAnimationFrame(moveSquare);
  }

  carre.addEventListener("click", () => {
    clickSound.currentTime = 0;
    clickSound.play();

    // 🎵 Son synthé Tone.js
    const synth = new Tone.Synth().toDestination();
    synth.triggerAttackRelease("C4", "8n");

    score++;
    scoreEl.textContent = "Score : " + score;

    vx *= 1.02;
    vy *= 1.02;

    const citation = citations[Math.floor(Math.random() * citations.length)];
    citationEl.textContent = citation;
    citationEl.style.opacity = 1;

    setTimeout(() => {
      citationEl.style.opacity = 0;
    }, 2000);
  });

  moveSquare();

  /* ÉTOILES ANIMÉES */
  const starContainer = document.getElementById("star-container");
  for (let i = 0; i < 40; i++) {
    const star = document.createElement("div");
    star.classList.add("stars");
    star.style.left = Math.random() * 100 + "vw";
    star.style.top = Math.random() * 100 + "vh";
    star.style.opacity = Math.random();
    star.style.animationDuration = (4 + Math.random() * 4) + "s";
    starContainer.appendChild(star);
  }
</script>
