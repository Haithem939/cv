<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attrape le Carré</title>

<style>
  body {
    background: linear-gradient(135deg, #1b2735, #090a0f);
    height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: white;
  }

  #game-container {
    position: relative;
    width: 90vw;
    height: 80vh;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 14px;
    overflow: hidden;
  }

  #carre {
    width: 60px;
    height: 60px;
    background: #ff4e4e;
    position: absolute;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  #carre:active {
    transform: scale(0.9);
  }

  #score {
    position: absolute;
    top: 15px;
    left: 20px;
    font-size: 1.5rem;
    font-weight: bold;
  }

  #citation {
    position: absolute;
    bottom: 15px;
    width: 100%;
    text-align: center;
    font-size: 1.1rem;
    opacity: 0;
    transition: opacity 0.5s ease-in-out;
  }
</style>

</head>
<body>

<div id="game-container">
  <div id="score">Score : 0</div>
  <div id="carre"></div>
  <div id="citation"></div>
</div>

<script>
  const carre = document.getElementById("carre");
  const scoreEl = document.getElementById("score");
  const citationEl = document.getElementById("citation");
  const container = document.getElementById("game-container");
  let score = 0;

  const citations = [
    "« Le succès est la somme de petits efforts répétés chaque jour. »",
    "« Tu es plus fort que tu ne le penses. »",
    "« Chaque progrès commence par une petite action. »",
    "« La persévérance finit toujours par gagner. »",
    "« Continue. Même lentement, tu avances. »",
    "« Aujourd’hui est une bonne journée pour essayer. »",
    "« Ne lâche rien, tu es proche ! »"
  ];

  function nouvellePosition() {
    const maxX = container.clientWidth - carre.clientWidth;
    const maxY = container.clientHeight - carre.clientHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    carre.style.left = x + "px";
    carre.style.top = y + "px";
  }

  function nouvelleCitation() {
    const texte = citations[Math.floor(Math.random() * citations.length)];
    citationEl.textContent = texte;
    citationEl.style.opacity = 1;

    setTimeout(() => {
      citationEl.style.opacity = 0;
    }, 2000);
  }

  carre.addEventListener("click", () => {
    score++;
    scoreEl.textContent = "Score : " + score;
    nouvellePosition();
    nouvelleCitation();
  });

  // Position de départ
  nouvellePosition();
</script>

</body>
</html>
