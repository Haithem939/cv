<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catch the Square</title>

<style>
    body {
        margin: 0;
        background: #1a1a1a;
        font-family: Arial, sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        color: white;
    }

    /* Zone de jeu */
    #gameZone {
        width: 400px;
        height: 400px;
        background: rgba(255, 255, 255, 0.06);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 15px;
        position: relative;
    }

    /* Carré rouge */
    #target {
        width: 40px;
        height: 40px;
        background: red;
        position: absolute;
        border-radius: 5px;
        cursor: pointer;
    }

    /* Citation */
    #citationBox {
        position: absolute;
        bottom: -60px;
        width: 100%;
        text-align: center;
        opacity: 0;
        transition: 0.4s;
        font-size: 18px;
    }
</style>
</head>

<body>

<div id="gameZone">
    <div id="target"></div>
    <div id="citationBox"></div>
</div>

<script>
    const gameZone = document.getElementById("gameZone");
    const target = document.getElementById("target");
    const citationBox = document.getElementById("citationBox");

    const citations = [
        "« La discipline bat le talent, quand le talent ne se discipline pas. »",
        "« Avance un peu chaque jour. Même un petit pas compte. »",
        "« Tu deviens ce que tu répètes. »",
        "« Le futur appartient à ceux qui se lèvent. »"
    ];

    // Carré rouge se déplace plus doucement
    function moveTarget() {
        const maxX = gameZone.clientWidth - 40;
        const maxY = gameZone.clientHeight - 40;

        const x = Math.random() * maxX;
        const y = Math.random() * maxY;

        target.style.left = x + "px";
        target.style.top = y + "px";
    }

    moveTarget();
    setInterval(moveTarget, 1200); // déplacement plus doux

    // Quand on attrape le carré
    target.addEventListener("click", () => {
        const citation = citations[Math.floor(Math.random() * citations.length)];
        citationBox.textContent = citation;

        citationBox.style.opacity = 1;
        citationBox.style.bottom = "10px";

        setTimeout(() => {
            citationBox.style.opacity = 0;
            citationBox.style.bottom = "-60px";
        }, 2000);

        moveTarget();
    });
</script>

</body>
</html>
