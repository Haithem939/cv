<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation Mix</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: radial-gradient(circle at center, #0d1b2a, #000 80%);
    font-family: Arial, sans-serif;
    color: #fff;
    position: relative;
  }

  /* Etoiles */
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.2; }
    to { opacity: 1; }
  }

  /* Orbite du texte */
  .orbite {
    position: relative;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    animation: rotation 15s linear infinite;
  }

  .texte {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.5rem;
    color: #ffdd57;
    text-shadow: 0 0 8px #ffdd57;
  }

  @keyframes rotation {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Petit carré qui se déplace */
  .carre {
    position: absolute;
    width: 30px;
    height: 30px;
    background: red;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 5px;
  }

  /* Citation */
  .citation {
    position: absolute;
    bottom: 20px;
    font-size: 1.2rem;
    text-align: center;
    width: 100%;
    color: #a0e7e5;
    font-style: italic;
    text-shadow: 0 0 5px #000;
  }

</style>
</head>
<body>

<div class="orbite">
  <div class="texte">Bienvenue 🌍</div>
</div>

<div class="carre"></div>

<div class="citation" id="citation"></div>

<audio id="musique" autoplay loop>
  <!-- Remplace le src par ton fichier audio local ou un lien libre -->
  <source src="musique.mp3" type="audio/mpeg">
  Votre navigateur ne supporte pas l'audio.
</audio>

<script>
  // Générer étoiles
  const stars = 100;
  for(let i = 0; i < stars; i++){
    const star = document.createElement('div');
    star.classList.add('star');
    star.style.top = Math.random() * window.innerHeight + 'px';
    star.style.left = Math.random() * window.innerWidth + 'px';
    star.style.width = star.style.height = Math.random() * 3 + 1 + 'px';
    document.body.appendChild(star);
  }

  // Déplacement carré doux
  const carre = document.querySelector('.carre');
  let x = window.innerWidth/2, y = window.innerHeight/2;
  let dx = 1.5, dy = 1;
  function moveCarre(){
    x += dx;
    y += dy;

    if(x < 0 || x > window.innerWidth - 30) dx *= -1;
    if(y < 0 || y > window.innerHeight - 30) dy *= -1;

    carre.style.left = x + 'px';
    carre.style.top = y + 'px';
    requestAnimationFrame(moveCarre);
  }
  moveCarre();

  // Citations aléatoires
  const citations = [
    "La vie est un mystère qu’il faut vivre, et non un problème à résoudre.",
    "Fais de ta vie un rêve, et d’un rêve, une réalité.",
    "Le succès n’est pas la clé du bonheur. Le bonheur est la clé du succès.",
    "Crois en toi et tout sera possible.",
    "Chaque jour est une nouvelle chance de briller."
  ];
  const citationEl = document.getElementById('citation');
  function nouvelleCitation(){
    const index = Math.floor(Math.random() * citations.length);
    citationEl.textContent = citations[index];
  }
  nouvelleCitation();
  setInterval(nouvelleCitation, 5000); // change toutes les 5 secondes
</script>

</body>
</html>
