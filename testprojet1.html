<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attrape le Carré – Niveaux & Chrono</title>
<style>
  body {
    margin: 0;
    font-family: "Poppins", sans-serif;
    background: radial-gradient(circle at 20% 20%, #1a1f3c, #090a0f);
    display: flex;
    color: white;
  }

  #controls {
    width: 250px;
    padding: 15px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  #game-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #game {
    position: relative;
    width: 90vw;
    height: 80vh;
    border-radius: 20px;
    border: 2px solid rgba(255,255,255,0.15);
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(8px);
    overflow: hidden;
    box-shadow: 0 0 25px rgba(255,255,255,0.08);
  }

  #carre {
    width: 70px;
    height: 70px;
    background: #ff3b3b;
    border-radius: 15px;
    position: absolute;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255, 60, 60, 0.8);
    transition: transform 0.15s ease;
  }

  #score, #timer {
    position: absolute;
    font-size: 1.5rem;
    text-shadow: 0 0 10px rgba(0,0,0,0.5);
  }

  #score { top: 10px; left: 10px; }
  #timer { top: 10px; right: 10px; }

  #citation {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    font-size: 1.2rem;
    opacity: 0;
    transition: opacity 0.8s ease-in-out;
  }

  button {
    padding: 8px;
    font-size: 1rem;
    cursor: pointer;
    border-radius: 6px;
    border: none;
    background: #ff4040;
    color: white;
    transition: 0.2s;
  }

  button:hover {
    background: #ff6161;
  }

  select, input[type=number] {
    padding: 6px;
    font-size: 1rem;
    border-radius: 5px;
    border: none;
  }
</style>
</head>
<body>
