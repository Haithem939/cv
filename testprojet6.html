<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attrape le Carré – Galaxy</title>

<style>
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background: #000;
  display: flex;
  color: white;
}

/* CONTROLES */
#controls {
  width: 270px;
  padding: 20px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  box-shadow: 0 0 25px rgba(0,0,0,0.4);
  display: flex;
  flex-direction: column;
  gap: 15px;
}

#controls h3 {
  text-align: center;
  color: #61c6ff;
  text-shadow: 0 0 12px #61c6ff;
}

label {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

select, input {
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: rgba(255,255,255,0.15);
  color: white;
}

button {
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(45deg, #ff4d4d, #ff2626);
  color: white;
  cursor: pointer;
  font-weight: bold;
}

/* GAME */
#game-container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

#game {
  position: relative;
  width: 90vw;
  height: 80vh;
  border-radius: 25px;
  background: #000;
  overflow: hidden;
}

/* ETOILES */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  opacity: 0.8;
}

/* CARRE */
#carre {
  position: absolute;
  width: 70px;
  height: 70px;
  border-radius: 12px;
  cursor: pointer;
  z-index: 10;
}

/* TRAIL */
.trail {
  position: absolute;
  border-radius: 12px;
  filter: blur(12px);
  opacity: 0.6;
  pointer-events: none;
}

/* HUD */
#score, #timer {
  position: absolute;
  top: 15px;
  font-size: 1.4rem;
}

#score { left: 20px; }
#timer { right: 20px; }

#citation {
  position: absolute;
  bottom: 25px;
  width: 100%;
  text-align: center;
  opacity: 0;
  transition: 0.6s;
}

/* COUNTDOWN */
#countdown {
  position: absolute;
  font-size: 5rem;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: none;
}
</style>
</head>

<body>

<div id="controls">
  <h3>🎮 Commandes</h3>

  <label>Niveau
    <select id="niveau">
      <option value="facile">Facile</option>
      <option value="moyen">Moyen</option>
      <option value="difficile">Difficile</option>
      <option value="hardcore">Hardcore</option>
    </select>
  </label>

  <label>Vitesse
    <input type="number" id="vitesseControl" value="3">
  </label>

  <label>Temps
    <input type="number" id="tempsControl" value="15">
  </label>

  <button id="startBtn">🚀 Démarrer</button>
  <p id="niveauInfo"></p>
</div>

<div id="game-container">
  <div id="game">
    <div id="score">Score : 0</div>
    <div id="timer">Temps : 0</div>
    <div id="carre"></div>
    <div id="citation"></div>
    <div id="countdown">3</div>
  </div>
</div>

<script>
const game = document.getElementById("game");
const carre = document.getElementById("carre");
const scoreEl = document.getElementById("score");
const timerEl = document.getElementById("timer");
const citationEl = document.getElementById("citation");
const countdownEl = document.getElementById("countdown");

const niveauSelect = document.getElementById("niveau");
const vitesseInput = document.getElementById("vitesseControl");
const tempsInput = document.getElementById("tempsControl");
const startBtn = document.getElementById("startBtn");

let x = 100, y = 100, vx = 3, vy = 3;
let score = 0, timer = 0, clicksRequis = 0;
let gameStarted = false;
let timerInterval = null;

/* ETOILES */
for(let i=0;i<120;i++){
  const s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*game.clientWidth+"px";
  s.style.top=Math.random()*game.clientHeight+"px";
  game.appendChild(s);
}

/* NIVEAUX */
function setNiveau(n){
  if(n==="facile"){vx=vy=3;timer=15;clicksRequis=3;}
  if(n==="moyen"){vx=vy=5;timer=25;clicksRequis=5;}
  if(n==="difficile"){vx=vy=8;timer=35;clicksRequis=7;}
  if(n==="hardcore"){vx=vy=15;timer=20;clicksRequis=10;carre.style.width="40px";carre.style.height="40px";}
}

/* TRAIL */
function trail(){
  const t=document.createElement("div");
  t.className="trail";
  t.style.left=x+"px";
  t.style.top=y+"px";
  t.style.width=carre.offsetWidth+"px";
  t.style.height=carre.offsetHeight+"px";
  t.style.background=carre.style.background;
  game.appendChild(t);
  setTimeout(()=>t.remove(),300);
}

/* MOVE */
function move(){
  if(!gameStarted){requestAnimationFrame(move);return;}

  x+=vx; y+=vy;
  const maxX=game.clientWidth-carre.offsetWidth;
  const maxY=game.clientHeight-carre.offsetHeight;

  if(x<0||x>maxX) vx*=-1;
  if(y<0||y>maxY) vy*=-1;

  carre.style.left=x+"px";
  carre.style.top=y+"px";
  trail();

  requestAnimationFrame(move);
}

/* CLICK */
carre.onclick=()=>{
  if(!gameStarted) return;

  score++;
  scoreEl.textContent="Score : "+score;

  const c=`rgb(${Math.random()*255},${Math.random()*255},${Math.random()*255})`;
  carre.style.background=c;
};

/* START */
startBtn.onclick=()=>{
  clearInterval(timerInterval);
  gameStarted=false;

  let c=3;
  countdownEl.style.display="block";
  countdownEl.textContent=c;

  const cd=setInterval(()=>{
    c--;
    countdownEl.textContent=c;
    if(c===0){
      clearInterval(cd);
      countdownEl.style.display="none";
      startGame();
    }
  },1000);
};

function startGame(){
  score=0;
  scoreEl.textContent="Score : 0";

  setNiveau(niveauSelect.value);
  vx=vy=Number(vitesseInput.value);
  timer=Number(tempsInput.value);

  timerEl.textContent="Temps : "+timer;
  gameStarted=true;

  timerInterval=setInterval(()=>{
    timer--;
    timerEl.textContent="Temps : "+timer;
    if(timer<=0){
      clearInterval(timerInterval);
      gameStarted=false;
      alert(score>=clicksRequis?"🔥 Niveau réussi !":"⏳ Perdu !");
    }
  },1000);
}

move();
</script>

</body>
</html>
