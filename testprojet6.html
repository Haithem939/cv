<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attrape le Carré – Galaxy Edition</title>

<style>
/* ---------------- RESET ---------------- */
* { box-sizing: border-box; }

/* ---------------- GLOBAL ---------------- */
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background: black;
  color: white;
  overflow: hidden;
}

/* ---------------- PAGE ACCUEIL ---------------- */
#home {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at top, #0b1230, #000);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 100;
  text-align: center;
}

#home h1 {
  font-size: 4rem;
  letter-spacing: 3px;
  color: #61c6ff;
  text-shadow: 0 0 30px #61c6ff;
  animation: glow 2s infinite alternate;
}

#home p {
  font-size: 1.3rem;
  opacity: 0.85;
  margin-bottom: 40px;
}

#enterBtn {
  padding: 16px 40px;
  font-size: 1.3rem;
  border-radius: 50px;
  border: none;
  cursor: pointer;
  background: linear-gradient(45deg, #61c6ff, #9b7bff);
  color: black;
  font-weight: 700;
  box-shadow: 0 0 40px rgba(100,200,255,0.6);
  transition: 0.3s;
}

#enterBtn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 60px rgba(150,220,255,1);
}

@keyframes glow {
  from { text-shadow: 0 0 20px #61c6ff; }
  to { text-shadow: 0 0 45px #9b7bff; }
}

/* ---------------- LAYOUT JEU ---------------- */
#app {
  display: flex;
  height: 100vh;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s;
}

#app.active {
  opacity: 1;
  pointer-events: auto;
}

/* ---------------- CONTROLES ---------------- */
#controls {
  width: 280px;
  padding: 25px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(15px);
  border-right: 1px solid rgba(255,255,255,0.1);
  display: flex;
  flex-direction: column;
  gap: 18px;
}

#controls h3 {
  text-align: center;
  font-size: 1.6rem;
  color: #9b7bff;
  text-shadow: 0 0 15px #9b7bff;
}

label {
  font-size: 0.95rem;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

select, input {
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: rgba(255,255,255,0.15);
  color: white;
}

button {
  padding: 14px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  background: linear-gradient(45deg, #ff4d4d, #ff1f8f);
  font-weight: bold;
  letter-spacing: 1px;
  box-shadow: 0 0 20px rgba(255,80,150,0.6);
  transition: 0.3s;
}

button:hover {
  transform: scale(1.07);
  box-shadow: 0 0 35px rgba(255,120,180,1);
}

/* ---------------- ZONE JEU ---------------- */
#game-container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

#game {
  position: relative;
  width: 90%;
  height: 80%;
  background: black;
  border-radius: 25px;
  border: 2px solid rgba(255,255,255,0.15);
  overflow: hidden;
}

/* ---------------- ETOILES ---------------- */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  opacity: 0.8;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from { opacity: 0.2; }
  to { opacity: 1; }
}

/* ---------------- CARRE ---------------- */
#carre {
  position: absolute;
  width: 70px;
  height: 70px;
  border-radius: 14px;
  cursor: pointer;
  z-index: 10;
  transition: background 0.2s;
  background: hsl(0,100%,60%);
  box-shadow: 0 0 25px hsl(0,100%,60%), 0 0 45px hsl(0,100%,60%);
}

/* TRAIL */
.trail {
  position: absolute;
  filter: blur(14px);
  opacity: 0.5;
  border-radius: 14px;
  pointer-events: none;
}

/* HUD */
#score, #timer {
  position: absolute;
  top: 15px;
  font-size: 1.4rem;
  color: #61c6ff;
  text-shadow: 0 0 10px #61c6ff;
}

#score { left: 20px; }
#timer { right: 20px; }

/* CITATION */
#citation {
  position: absolute;
  bottom: 20px;
  width: 100%;
  text-align: center;
  font-size: 1.3rem;
  color: #ffb3b3;
  text-shadow: 0 0 15px #ff8080;
  opacity: 0;
  transition: opacity 0.5s;
}

/* COMPTE A REBOURS */
#countdown {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  font-size: 5rem;
  color: #61c6ff;
  text-shadow: 0 0 20px #61c6ff;
  z-index: 20;
  display: none;
}
</style>
</head>

<body>

<!-- PAGE ACCUEIL -->
<div id="home">
  <h1>GALAXY CUBE</h1>
  <p>Attrape le carré. Accélère. Survis.</p>
  <button id="enterBtn">🚀 Entrer dans le jeu</button>
</div>

<!-- APP -->
<div id="app">
  <div id="controls">
    <h3>🎮 Commandes</h3>

    <label>Niveau
      <select id="niveau">
        <option value="facile">Facile</option>
        <option value="moyen">Moyen</option>
        <option value="difficile">Difficile</option>
        <option value="hardcore">Hardcore</option>
      </select>
    </label>

    <label>Vitesse
      <input type="number" id="vitesseControl" value="3">
    </label>

    <label>Temps
      <input type="number" id="tempsControl" value="15">
    </label>

    <button id="startBtn">▶ Démarrer</button>
    <p id="niveauInfo"></p>
  </div>

  <div id="game-container">
    <div id="game">
      <div id="score">Score : 0</div>
      <div id="timer">Temps : 0</div>
      <div id="carre"></div>
      <div id="citation"></div>
      <div id="countdown">3</div>
    </div>
  </div>
</div>

<script>
const home = document.getElementById("home");
const app = document.getElementById("app");
const enterBtn = document.getElementById("enterBtn");
const game = document.getElementById("game");
const carre = document.getElementById("carre");
const scoreEl = document.getElementById("score");
const timerEl = document.getElementById("timer");
const countdownEl = document.getElementById("countdown");
const startBtn = document.getElementById("startBtn");
const niveauSelect = document.getElementById("niveau");
const vitesseInput = document.getElementById("vitesseControl");
const tempsInput = document.getElementById("tempsControl");
const niveauInfo = document.getElementById("niveauInfo");
const citationEl = document.getElementById("citation");

let x=100, y=100, vx=3, vy=3, score=0, timer=0, clicksRequis=0;
let gameStarted=false;
let countdownInterval=null, timerInterval=null;

const citations = [
  "Continue, tu brilles ✨","Chaque clic te rend meilleur 💪","Tu progresses !",
  "Tu es plus fort que tu ne le crois 🔥","Rien ne t’arrête.","Encore un clic ! 💥",
  "Tu es dans le flow 😎","Ne lâche rien !","Le succès est proche",
  "Tout est possible","Chaque seconde compte","Reste concentré",
  "Tu peux le faire !","Toujours avancer","Plus vite !","Chaque clic compte",
  "Rêve grand","Fais-le pour toi","Persévère","Crois en toi",
  "Force et courage","Jamais abandonner","Tu es un champion",
  "La victoire est proche","Plus haut !","Toujours plus fort",
  "Tu brilles","Chaque mouvement compte","Ton effort paie","Continue comme ça"
];

// PAGE ACCUEIL
enterBtn.onclick = ()=>{
  home.style.display="none";
  app.classList.add("active");
};

// Etoiles
for(let i=0;i<120;i++){
  const s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";
  game.appendChild(s);
}

// Niveaux
function setNiveau(){
  const niv = niveauSelect.value;
  if(niv==="facile"){ vx=vy=3; timer=parseInt(tempsInput.value); clicksRequis=3; carre.style.width="70px"; carre.style.height="70px"; }
  if(niv==="moyen"){ vx=vy=5; timer=parseInt(tempsInput.value); clicksRequis=5; carre.style.width="70px"; carre.style.height="70px"; }
  if(niv==="difficile"){ vx=vy=8; timer=parseInt(tempsInput.value); clicksRequis=7; carre.style.width="70px"; carre.style.height="70px"; }
  if(niv==="hardcore"){ vx=vy=15; timer=parseInt(tempsInput.value); clicksRequis=10; carre.style.width="40px"; carre.style.height="40px"; }

  vitesseInput.value=vx;
  niveauInfo.textContent=`Objectif : ${clicksRequis} clics en ${timer}s`;
}

// Déplacement
function move(){
  if(!gameStarted){ requestAnimationFrame(move); return; }

  const maxX = game.clientWidth - carre.offsetWidth;
  const maxY = game.clientHeight - carre.offsetHeight;

  x+=vx; y+=vy;
  if(x<0||x>maxX) vx*=-1;
  if(y<0||y>maxY) vy*=-1;

  carre.style.left=x+"px";
  carre.style.top=y+"px";

  // Trail
  const trail = document.createElement("div");
  trail.className="trail";
  trail.style.left=x+"px";
  trail.style.top=y+"px";
  trail.style.width=carre.offsetWidth+"px";
  trail.style.height=carre.offsetHeight+"px";
  trail.style.background=carre.style.background;
  game.appendChild(trail);
  setTimeout(()=>trail.remove(),250);

  requestAnimationFrame(move);
}

// Click carré
carre.onclick = ()=>{
  score++;
  scoreEl.textContent="Score : "+score;

  const c=`hsl(${Math.random()*360},100%,60%)`;
  carre.style.background=c;
  carre.style.boxShadow=`0 0 25px ${c}, 0 0 45px ${c}`;

  // Affiche citation aléatoire
  const citation = citations[Math.floor(Math.random()*citations.length)];
  citationEl.textContent = citation;
  citationEl.style.opacity = 1;
  setTimeout(()=>{ citationEl.style.opacity = 0; },1500);

  // Passage automatique au niveau suivant
  if(score >= clicksRequis){
    gameStarted=false;
    clearInterval(timerInterval);
    alert("🔥 Niveau réussi ! Passage au niveau suivant.");
    const levels = ["facile","moyen","difficile","hardcore"];
    let currentIndex = levels.indexOf(niveauSelect.value);
    let nextIndex = currentIndex+1 < levels.length ? currentIndex+1 : 0;
    niveauSelect.value = levels[nextIndex];
    startBtn.click();
  }
};

// Start jeu
startBtn.onclick = ()=>{
  score=0;
  scoreEl.textContent="Score : 0";
  setNiveau();
  x=Math.random()*(game.clientWidth-carre.offsetWidth);
  y=Math.random()*(game.clientHeight-carre.offsetHeight);
  carre.style.left=x+"px";
  carre.style.top=y+"px";
  carre.style.background="hsl(0,100%,60%)";
  carre.style.boxShadow="0 0 25px hsl(0,100%,60%),0 0 45px hsl(0,100%,60%)";

  gameStarted=false;
  countdownEl.style.display="block";
  let count=3;
  countdownEl.textContent=count;

  clearInterval(countdownInterval);
  clearInterval(timerInterval);

  countdownInterval = setInterval(()=>{
    count--;
    if(count>0){
      countdownEl.textContent=count;
    } else {
      clearInterval(countdownInterval);
      countdownEl.style.display="none";
      gameStarted=true;

      timer = parseInt(tempsInput.value);
      timerEl.textContent="Temps : "+timer+"s";

      timerInterval = setInterval(()=>{
        timer--;
        timerEl.textContent="Temps : "+timer+"s";
        if(timer<=0){
          clearInterval(timerInterval);
          gameStarted=false;
          alert("⏳ Temps écoulé ! Score : "+score);
        }
      },1000);
    }
  },1000);
};

move();
</script>

</body>
</html>
