<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attrape le Carré – Niveaux & Chrono</title>

<style>
/* ---------------------- GLOBAL ---------------------- */
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background: linear-gradient(130deg, #0a0f1f, #111a2f, #0a0f1f);
  background-size: 300% 300%;
  animation: bgMove 12s infinite alternate;
  display: flex;
  color: white;
}

@keyframes bgMove {
  0% { background-position: 0% 30%; }
  100% { background-position: 80% 70%; }
}

/* ---------------------- PANNEAU DE CONTROLE ---------------------- */
#controls {
  width: 270px;
  padding: 20px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  box-shadow: 0 0 25px rgba(0,0,0,0.4);
  border-right: 1px solid rgba(255,255,255,0.1);
  display: flex;
  flex-direction: column;
  gap: 17px;
}

#controls h3 {
  font-size: 1.4rem;
  text-align: center;
  color: #61c6ff;
  text-shadow: 0 0 12px #61c6ff;
}

label {
  font-size: 1rem;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

select, input[type=number] {
  padding: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.15);
  color: white;
}

/* ---------------------- BOUTON START ---------------------- */
button {
  padding: 12px;
  font-size: 1.1rem;
  cursor: pointer;
  border-radius: 10px;
  border: none;
  background: linear-gradient(45deg, #ff4d4d, #ff2626);
  color: white;
  font-weight: 600;
  letter-spacing: 1px;
  box-shadow: 0 0 15px rgba(255,60,60,0.5);
  transition: 0.25s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 22px rgba(255,80,80,0.9);
}

/* ---------------------- ZONE DE JEU ---------------------- */
#game-container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

#game {
  position: relative;
  width: 90vw;
  height: 80vh;
  border-radius: 25px;
  border: 2px solid rgba(255,255,255,0.18);
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(7px);
  overflow: hidden;
  box-shadow: 0 0 40px rgba(255,255,255,0.06);
}

/* ---------------------- CARRE ---------------------- */
#carre {
  width: 70px;
  height: 70px;
  background: #ff3333;
  border-radius: 12px;
  position: absolute;
  cursor: pointer;
  box-shadow: 0 0 25px rgba(255, 60, 60, 0.9), 0 0 45px rgba(255, 0, 0, 0.4);
  animation: pulse 1.6s infinite alternate;
  transition: 0.15s;
}

/* Traînée lumineuse */
.trail {
  position: absolute;
  width: 70px;
  height: 70px;
  background: rgba(255, 50, 50, 0.4);
  border-radius: 12px;
  pointer-events: none;
  filter: blur(8px);
}

/* Pulse animation */
@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.15); }
}

/* ---------------------- SCORE + TIMER ---------------------- */
#score, #timer {
  position: absolute;
  font-size: 1.6rem;
  font-weight: 600;
  color: #89d4ff;
  text-shadow: 0 0 12px #2db7ff;
}

#score { top: 12px; left: 20px; }
#timer { top: 12px; right: 20px; }

/* ---------------------- CITATION ---------------------- */
#citation {
  position: absolute;
  bottom: 30px;
  width: 100%;
  text-align: center;
  font-size: 1.3rem;
  opacity: 0;
  color: #ffb3b3;
  text-shadow: 0 0 15px #ff8080;
  transition: opacity 0.8s ease-in-out;
}
</style>
</head>

<body>

<!-- ---------------------- CONTROLES ---------------------- -->
<div id="controls">
  <h3>🎮 Contrôles</h3>

  <label>Niveau :
    <select id="niveau">
      <option value="facile">Facile</option>
      <option value="moyen">Moyen</option>
      <option value="difficile">Difficile</option>
      <option value="hardcore">Hardcore</option>
    </select>
  </label>

  <label>Vitesse manuelle :
    <input type="number" id="vitesseControl" min="1" max="20" value="3">
  </label>

  <label>Temps (sec) :
    <input type="number" id="tempsControl" min="5" max="60" value="15">
  </label>

  <button id="startBtn">🚀 Démarrer</button>
  <p id="niveauInfo"></p>
</div>

<!-- ---------------------- JEU ---------------------- -->
<div id="game-container">
  <div id="game">
    <div id="score">Score : 0</div>
    <div id="timer">Temps : 0</div>
    <div id="carre"></div>
    <div id="citation"></div>
  </div>
</div>

<audio id="clickSound">
  <source src="son.mp3" type="audio/mpeg">
</audio>

<script>
/* ------------- VARIABLES ---------------- */
const game = document.getElementById("game");
const carre = document.getElementById("carre");
const scoreEl = document.getElementById("score");
const timerEl = document.getElementById("timer");
const citationEl = document.getElementById("citation");
const clickSound = document.getElementById("clickSound");
const niveauSelect = document.getElementById("niveau");
const vitesseInput = document.getElementById("vitesseControl");
const tempsInput = document.getElementById("tempsControl");
const startBtn = document.getElementById("startBtn");
const niveauInfo = document.getElementById("niveauInfo");

const citations = [
  "Continue, tu brilles ✨",
  "Chaque clic te rend meilleur 💪",
  "Tu progresses !",
  "Tu es plus fort que tu ne le crois 🔥",
  "Rien ne t’arrête.",
  "Encore un clic ! 💥",
  "Tu es dans le flow 😎"
];

let vx = 3, vy = 3;
let x = 50, y = 50;
let score = 0;
let timer = 0;
let clicksRequis = 0;
let countdown;
let gameStarted = false;

/* ------------- NIVEAUX ---------------- */
function setNiveau(niv) {
  if (niv === "facile") { vx = vy = 3; timer = 15; clicksRequis = 3; carre.style.width="70px"; carre.style.height="70px"; }
  if (niv === "moyen") { vx = vy = 5; timer = 25; clicksRequis = 5; carre.style.width="70px"; carre.style.height="70px"; }
  if (niv === "difficile") { vx = vy = 8; timer = 35; clicksRequis = 7; carre.style.width="70px"; carre.style.height="70px"; }
  if (niv === "hardcore") { vx = vy = 15; timer = 20; clicksRequis = 10; carre.style.width="40px"; carre.style.height="40px"; }

  vitesseInput.value = vx;
  tempsInput.value = timer;
  niveauInfo.textContent = `Objectif : ${clicksRequis} clics en ${timer}s`;
}

/* ------------- TRAINEE ---------------- */
function createTrail() {
  const trail = document.createElement("div");
  trail.className = "trail";
  trail.style.left = x + "px";
  trail.style.top = y + "px";
  game.appendChild(trail);
  setTimeout(() => game.removeChild(trail), 500);
}

/* ------------- ANIMATION CARRE ---------------- */
function deplacerCarre() {
  const maxX = game.clientWidth - carre.offsetWidth;
  const maxY = game.clientHeight - carre.offsetHeight;

  x += vx;
  y += vy;

  // Empêche le dépassement des bords
  if (x < 0) { x = 0; vx *= -1; }
  if (y < 0) { y = 0; vy *= -1; }
  if (x > maxX) { x = maxX; vx *= -1; }
  if (y > maxY) { y = maxY; vy *= -1; }

  carre.style.left = x + "px";
  carre.style.top = y + "px";

  createTrail();

  requestAnimationFrame(deplacerCarre);
}

/* ------------- CLICK CARRE ---------------- */
carre.addEventListener("click", () => {
  clickSound.currentTime = 0;
  clickSound.play();

  score++;
  scoreEl.textContent = "Score : " + score;

  const citation = citations[Math.floor(Math.random() * citations.length)];
  citationEl.textContent = citation;
  citationEl.style.opacity = 1;
  setTimeout(() => { citationEl.style.opacity = 0; }, 1500);

  vx *= 1.03;
  vy *= 1.03;
});

/* ------------- START GAME ---------------- */
startBtn.addEventListener("click", () => {
  score = 0;
  scoreEl.textContent = "Score : 0";

  x = game.clientWidth / 2 - carre.offsetWidth/2;
  y = game.clientHeight / 2 - carre.offsetHeight/2;

  carre.style.left = x + "px";
  carre.style.top = y + "px";

  const niv = niveauSelect.value;
  setNiveau(niv);

  vx = Number(vitesseInput.value);
  vy = Number(vitesseInput.value);
  timer = Number(tempsInput.value);
  timerEl.textContent = `Temps : ${timer}s`;

  gameStarted = true;

  clearInterval(countdown);
  countdown = setInterval(() => {
    timer--;
    timerEl.textContent = `Temps : ${timer}s`;

    if (timer <= 0) {
      clearInterval(countdown);
      gameStarted = false;

      if (score >= clicksRequis) {
        alert("🔥 Bravo ! Niveau réussi !");
      } else {
        alert("⏳ Temps écoulé !");
      }
    }
  }, 1000);
});

/* ------------- INITIALISATION ---------------- */
deplacerCarre();
setNiveau("facile");
</script>

</body>
</html>
