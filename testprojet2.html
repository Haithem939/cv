<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attrape le Carré – Niveaux & Chrono</title>

<style>
  body {
    margin: 0;
    font-family: "Poppins", sans-serif;
    background: radial-gradient(circle at 20% 20%, #1a1f3c, #090a0f);
    display: flex;
    color: white;
  }

  #controls {
    width: 250px;
    padding: 15px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  #game-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #game {
    position: relative;
    width: 90vw;
    height: 80vh;
    border-radius: 20px;
    border: 2px solid rgba(255,255,255,0.15);
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(8px);
    overflow: hidden;
    box-shadow: 0 0 25px rgba(255,255,255,0.08);
  }

  #carre {
    width: 70px;
    height: 70px;
    background: #ff3b3b;
    border-radius: 15px;
    position: absolute;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255, 60, 60, 0.8);
  }

  #score, #timer {
    position: absolute;
    font-size: 1.5rem;
    text-shadow: 0 0 10px rgba(0,0,0,0.5);
  }

  #score { top: 10px; left: 10px; }
  #timer { top: 10px; right: 10px; }

  #citation {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    font-size: 1.2rem;
    opacity: 0;
    transition: opacity 0.8s ease-in-out;
  }

  button {
    padding: 8px;
    font-size: 1rem;
    cursor: pointer;
    border-radius: 6px;
    border: none;
    background: #ff4040;
    color: white;
    transition: 0.2s;
  }

  button:hover { background: #ff6161; }

  select, input[type=number] {
    padding: 6px;
    font-size: 1rem;
    border-radius: 5px;
    border: none;
  }
</style>
</head>
<body>

<div id="controls">
  <h3>Contrôles</h3>

  <label>Niveau:
    <select id="niveau">
      <option value="facile">Facile</option>
      <option value="moyen">Moyen</option>
      <option value="difficile">Difficile</option>
    </select>
  </label>

  <label>Vitesse manuelle:
    <input type="number" id="vitesseControl" min="1" max="20" value="3">
  </label>

  <label>Temps (sec):
    <input type="number" id="tempsControl" min="5" max="60" value="15">
  </label>

  <button id="startBtn">Démarrer</button>

  <p id="niveauInfo"></p>
</div>

<div id="game-container">
  <div id="game">
    <div id="score">Score: 0</div>
    <div id="timer">Temps: 0</div>
    <div id="carre"></div>
    <div id="citation"></div>
  </div>
</div>

<!-- 🔊 SON CORRECTEMENT AJOUTÉ -->
: <audio id="clickSound">
<source src="son.mp3" type="audio/mpeg">
</audio>
<script>
const game = document.getElementById("game");
const carre = document.getElementById("carre");
const scoreEl = document.getElementById("score");
const timerEl = document.getElementById("timer");
const citationEl = document.getElementById("citation");
const clickSound = document.getElementById("clickSound");

const niveauSelect = document.getElementById("niveau");
const vitesseInput = document.getElementById("vitesseControl");
const tempsInput = document.getElementById("tempsControl");
const startBtn = document.getElementById("startBtn");
const niveauInfo = document.getElementById("niveauInfo");

const citations = [
  "Continue, tu brilles déjà.",
  "Chaque clic te rend meilleur.",
  "Tu progresses à ton rythme.",
  "Tu es plus fort que tu ne le crois.",
  "Rien n’arrête quelqu’un qui continue.",
  "Aujourd’hui, tu gagnes encore.",
  "Tu écris ton propre rythme."
];

let vx = 3, vy = 3;
let x = 50, y = 50;
let score = 0;
let timer = 0;
let clicksRequis = 0;
let countdown;

// Définition des niveaux
function setNiveau(niveau) {
  if (niveau === "facile") {
    vx = vy = 3;
    timer = 15;
    clicksRequis = 3;
  }
  if (niveau === "moyen") {
    vx = vy = 5;
    timer = 30;
    clicksRequis = 5;
  }
  if (niveau === "difficile") {
    vx = vy = 7;
    timer = 50;
    clicksRequis = 7;
  }

  vitesseInput.value = vx;
  tempsInput.value = timer;

  niveauInfo.textContent = `Objectif : ${clicksRequis} clics en ${timer}s`;
}

// Déplacement
function deplacerCarre() {
  const maxX = game.clientWidth - carre.clientWidth;
  const maxY = game.clientHeight - carre.clientHeight;

  x += vx;
  y += vy;

  if (x <= 0 || x >= maxX) vx *= -1;
  if (y <= 0 || y >= maxY) vy *= -1;

  carre.style.left = x + "px";
  carre.style.top = y + "px";

  requestAnimationFrame(deplacerCarre);
}

// Clic
carre.addEventListener("click", () => {
  clickSound.currentTime = 0;
  clickSound.play();

  score++;
  scoreEl.textContent = "Score: " + score;

  const citation = citations[Math.floor(Math.random() * citations.length)];
  citationEl.textContent = citation;
  citationEl.style.opacity = 1;

  setTimeout(() => { citationEl.style.opacity = 0; }, 1800);

  vx *= 1.02;
  vy *= 1.02;
});

// Start
startBtn.addEventListener("click", () => {
  score = 0;
  scoreEl.textContent = "Score: 0";

  // Réinitialisation au centre
  x = game.clientWidth / 2 - 35;
  y = game.clientHeight / 2 - 35;

  carre.style.left = x + "px";
  carre.style.top = y + "px";

  const niv = niveauSelect.value;
  setNiveau(niv);

  vx = Number(vitesseInput.value);
  vy = Number(vitesseInput.value);
  timer = Number(tempsInput.value);

  timerEl.textContent = `Temps: ${timer}s`;

  clearInterval(countdown);
  countdown = setInterval(() => {
    timer--;
    timerEl.textContent = `Temps: ${timer}s`;

    if (timer <= 0) {
      clearInterval(countdown);

      if (score >= clicksRequis) {
        alert(`🔥 Bravo ! Tu as réussi le niveau ${niv} !`);
      } else {
        alert(`⏳ Temps écoulé ! Objectif non atteint.`);
      }
    }
  }, 1000);
});

// Init
setNiveau("facile");
deplacerCarre();
</script>

</body>
</html>
