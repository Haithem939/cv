<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cube Catch Game</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.37/Tone.min.js"></script>
<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1e1e2e, #2a2a40);
        color: white;
    }

    /* Le carré rouge */
    #cube {
        width: 50px;
        height: 50px;
        background: red;
        position: absolute;
        border-radius: 6px;
        cursor: pointer;
        transition: transform 0.1s;
    }

    /* Tableau de gauche (contrôles) */
    #controls {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 220px;
        padding: 15px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        backdrop-filter: blur(8px);
        box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    #controls h2 {
        margin-top: 0;
        font-size: 20px;
        text-align: center;
    }

    /* Texte des niveaux en NOIR comme demandé */
    #levels label {
        display: block;
        margin: 5px 0;
        color: black;  /* <--- CHANGEMENT DEMANDÉ */
        font-weight: bold;
        cursor: pointer;
    }

    select, input {
        width: 100%;
        padding: 6px;
        margin-top: 5px;
        border-radius: 6px;
        border: none;
    }

    #startBtn {
        width: 100%;
        padding: 10px;
        margin-top: 15px;
        background: #4caf50;
        border: none;
        border-radius: 6px;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    #timer, #score {
        margin-top: 10px;
        font-size: 18px;
        text-align: center;
    }
</style>
</head>

<body>

    <h2>Paramètres</h2>

        <label><input type="radio" name="difficulty" value="medium"> Moyen</label>
        <label><input type="radio" name="difficulty" value="hard"> Difficile</label>
    </div>
