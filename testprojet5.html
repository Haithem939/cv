<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attrape le Carré – Galaxy Mode</title>

<style>
/* ---------------------- GLOBAL ---------------------- */
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background: black;
  display: flex;
  color: white;
  overflow: hidden;
}

/* ---------------------- ÉTOILES ---------------------- */
#stars, #stars2, #stars3 {
  position: fixed;
  width: 100%;
  height: 100%;
  display: block;
  z-index: -1;
  top: 0;
  left: 0;
}

#stars {
  background: transparent url("data:image/svg+xml,\
  <svg xmlns='http://www.w3.org/2000/svg' width='3' height='3'>\
  <circle cx='1' cy='1' r='1' fill='white' />\
  </svg>") repeat;
  animation: animStar 100s linear infinite;
}
#stars2 {
  background: transparent url("data:image/svg+xml,\
  <svg xmlns='http://www.w3.org/2000/svg' width='2' height='2'>\
  <circle cx='1' cy='1' r='1' fill='#a0cfff' />\
  </svg>") repeat;
  animation: animStar 200s linear infinite;
}
#stars3 {
  background: transparent url("data:image/svg+xml,\
  <svg xmlns='http://www.w3.org/2000/svg' width='1' height='1'>\
  <circle cx='0.5' cy='0.5' r='0.5' fill='#ff9bff' />\
  </svg>") repeat;
  animation: animStar 300s linear infinite;
}

@keyframes animStar {
  from { transform: translateY(0); }
  to { transform: translateY(-2000px); }
}

/* ---------------------- PANNEAU DE CONTROLE ---------------------- */
#controls {
  width: 270px;
  padding: 20px;
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(12px);
  border-right: 1px solid rgba(255,255,255,0.1);
  display: flex;
  flex-direction: column;
  gap: 17px;
}

#controls h3 {
  text-align: center;
  color: #6ab7ff;
  text-shadow: 0 0 12px #53a8ff;
}

select, input[type=number] {
  padding: 10px;
  border-radius: 8px;
  background: rgba(255,255,255,0.15);
  color: white;
  border: none;
}

/* ---------------------- BOUTON ---------------------- */
button {
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(45deg, #ff4d4d, #ff2626);
  color: white;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 18px rgba(255,70,70,0.7);
}

/* ---------------------- JEU ---------------------- */
#game-container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

#game {
  position: relative;
  width: 90vw;
  height: 80vh;
  border-radius: 25px;
  border: 2px solid rgba(255,255,255,0.25);
  background: rgba(0,0,0,0.3);
  overflow: hidden;
  backdrop-filter: blur(5px);
}

/* ---------------------- CARRE ---------------------- */
#carre {
  width: 70px;
  height: 70px;
  background: red;
  border-radius: 10px;
  position: absolute;
  transition: 0.15s;
  box-shadow: 0 0 25px red, 0 0 60px red;
}

/* TRAÎNÉE */
.trail {
  position: absolute;
  width: 70px;
  height: 70px;
  border-radius: 10px;
  filter: blur(8px);
  opacity: 0.7;
  pointer-events: none;
}

/* Texte HUD */
#score, #timer {
  position: absolute;
  font-size: 1.5rem;
  font-weight: 600;
  text-shadow: 0 0 12px white;
}
#score { top: 12px; left: 20px; }
#timer { top: 12px; right: 20px; }

#citation {
  position: absolute;
  bottom: 30px;
  text-align: center;
  width: 100%;
  font-size: 1.2rem;
  opacity: 0;
  transition: opacity .8s;
}
</style>
</head>

<body>

<!-- ÉTOILES GALAXIE -->
<div id="stars"></div>
<div id="stars2"></div>
<div id="stars3"></div>

<!-- PANEL -->
<div id="controls">
  <h3>🎮 Contrôles</h3>

  <label>Niveau :
    <select id="niveau">
      <option value="facile">Facile</option>
      <option value="moyen">Moyen</option>
      <option value="difficile">Difficile</option>
      <option value="hardcore">Hardcore</option>
    </select>
  </label>

  <label>Vitesse :
    <input type="number" id="vitesseControl" min="1" max="20" value="3">
  </label>

  <label>Temps :
    <input type="number" id="tempsControl" min="5" max="60" value="15">
  </label>

  <button id="startBtn">🚀 Démarrer</button>
  <p id="niveauInfo"></p>
</div>

<!-- JEU -->
<div id="game-container">
  <div id="game">
    <div id="score">Score : 0</div>
    <div id="timer">Temps : 0</div>
    <div id="carre"></div>
    <div id="citation"></div>
  </div>
</div>

<script>
/* ---------------- VARIABLES ---------------- */
const game = document.getElementById("game");
const carre = document.getElementById("carre");
const scoreEl = document.getElementById("score");
const timerEl = document.getElementById("timer");
const citationEl = document.getElementById("citation");
const niveauSelect = document.getElementById("niveau");
const vitesseInput = document.getElementById("vitesseControl");
const tempsInput = document.getElementById("tempsControl");
const startBtn = document.getElementById("startBtn");
const niveauInfo = document.getElementById("niveauInfo");

const citations = [
"Continue, tu vas y arriver.",
"Tu brilles plus que tu ne le penses.",
"Chaque clic te rapproche de ton objectif.",
"Tu progresses à chaque instant.",
"La réussite commence maintenant.",
"Tu es en train d’écrire ton succès.",
"Crois en toi, tu gères.",
"Tu es clairement au-dessus.",
"Ne lâche rien, tu es sur la bonne voie.",
"Ton potentiel est énorme.",
"Chaque seconde compte, et tu l’utilises bien.",
"Tu surprends tout le monde.",
"Tu deviens plus rapide, plus fort.",
"Là tu montes en puissance.",
"Ton énergie est incroyable.",
"Tu es dans le flow total.",
"Tes efforts payent déjà.",
"Tu vas encore plus loin.",
"Tu transformes l’impossible.",
"Tu contrôles la situation.",
"Encore un clic, encore une victoire.",
"Tu surpasses ton niveau.",
"Ta détermination est folle.",
"Tu montes d’un cran.",
"Tu te dépasses là.",
"Le carré ne peut pas t’échapper.",
"Tu es précis, rapide, puissant.",
"Tu joues comme un pro.",
"Tu deviens un monstre.",
"Continue, tu vas exploser ton record."
];

let vx = 3, vy = 3;
let x = 50, y = 50;
let score = 0;
let timer = 0;
let clicksRequis = 0;

/* ---------------- CHANGEMENT DE COULEUR ---------------- */
function couleurAleatoire() {
  const r = Math.floor(Math.random()*255);
  const g = Math.floor(Math.random()*255);
  const b = Math.floor(Math.random()*255);
  return `rgb(${r},${g},${b})`;
}

/* ---------------- TRAÎNÉE ---------------- */
function createTrail(color) {
  const t = document.createElement("div");
  t.className = "trail";
  t.style.left = x + "px";
  t.style.top = y + "px";
  t.style.background = color;
  game.appendChild(t);
  setTimeout(()=>game.removeChild(t), 400);
}

/* ---------------- NIVEAUX ---------------- */
function setNiveau(n) {
  if (n=="facile") { vx=vy=3; timer=15; clicksRequis=3; carre.style.width=carre.style.height="70px"; }
  if (n=="moyen") { vx=vy=5; timer=20; clicksRequis=5; carre.style.width=carre.style.height="70px"; }
  if (n=="difficile") { vx=vy=8; timer=30; clicksRequis=7; carre.style.width=carre.style.height="70px"; }
  if (n=="hardcore") { vx=vy=13; timer=20; clicksRequis=10; carre.style.width=carre.style.height="40px"; }

  vitesseInput.value = vx;
  tempsInput.value = timer;

  niveauInfo.textContent = `Objectif : ${clicksRequis} clics en ${timer}s`;
}

/* ---------------- MOUVEMENT ---------------- */
function deplacerCarre() {
  const maxX = game.clientWidth - carre.offsetWidth;
  const maxY = game.clientHeight - carre.offsetHeight;

  x += vx;
  y += vy;

  if (x < 0) { x=0; vx*=-1; }
  if (y < 0) { y=0; vy*=-1; }
  if (x > maxX) { x=maxX; vx*=-1; }
  if (y > maxY) { y=maxY; vy*=-1; }

  carre.style.left = x + "px";
  carre.style.top = y + "px";

  createTrail(carre.style.background);

  requestAnimationFrame(deplacerCarre);
}

/* ---------------- CLIC SUR LE CARRE ---------------- */
carre.addEventListener("click", () => {
  score++;
  scoreEl.textContent = "Score : " + score;

  // Changer couleur
  const newColor = couleurAleatoire();
  carre.style.background = newColor;
  carre.style.boxShadow = `0 0 25px ${newColor}, 0 0 60px ${newColor}`;

  // Citation
  const txt = citations[Math.floor(Math.random()*citations.length)];
  citationEl.textContent = txt;
  citationEl.style.opacity = 1;
  setTimeout(()=>citationEl.style.opacity=0,1500);
});

/* ---------------- START ---------------- */
startBtn.addEventListener("click", () => {
  score = 0;
  scoreEl.textContent = "Score : 0";

  setNiveau(niveauSelect.value);

  vx = vy = Number(vitesseInput.value);
  timer = Number(tempsInput.value);
  timerEl.textContent = "Temps : " + timer;

  x = game.clientWidth/2;
  y = game.clientHeight/2;

  clearInterval(window.timerInterval);
  window.timerInterval = setInterval(()=>{
    timer--;
    timerEl.textContent = "Temps : " + timer;

    if (timer <= 0) {
      clearInterval(window.timerInterval);

      if (score >= clicksRequis) alert("🔥 Niveau réussi !");
      else alert("⏳ Temps écoulé !");
    }
  },1000);
});

/* ---------------- INIT ---------------- */
deplacerCarre();
setNiveau("facile");
</script>

</body>
</html>
